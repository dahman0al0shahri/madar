<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدار · رفع ملفات الإصدار</title><style>body{background:#14151c;color:#eee;font:18px/1.8 Tahoma;max-width:800px;margin:60px auto;padding:20px}button,input{font:inherit;padding:12px;margin:12px;color:inherit;background:#223340;border:1px solid #947d59;border-radius:8px}pre{white-space:pre-wrap}</style><h1>رفع ملفات الإصدار — للمالك</h1><p>اختر الأجزاء الثلاثة. تُفحص بصمة كل جزء قبل اعتماده، وتُستأنف الأجزاء الناجحة دون إعادة رفعها.</p><label>أجزاء الوسائط<input id="files" type="file" multiple accept=".bin"></label><button id="send">رفع الأجزاء والتحقق</button><pre id="status" role="status">جارٍ فحص التخزين…</pre><script>
const api='/api/admin/media-transfer',status=document.getElementById('status'),send=document.getElementById('send');
async function call(action,body){const r=await fetch(api+(action?'?action='+action:''),{method:action?'POST':'GET',body,headers:body?{'Content-Type':'application/octet-stream'}:{},cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||r.status);return d;}
call('').then(d=>status.textContent=d.ready?'اكتمل رفع جميع المقاطع الـ147 والتحقق منها.':'جاهز لرفع '+d.parts.length+' أجزاء.').catch(e=>status.textContent=e.message);
send.onclick=async()=>{send.disabled=true;try{let state=await call('');if(state.ready){status.textContent='اكتمل رفع جميع المقاطع الـ147 والتحقق منها.';return;}const files=[...document.getElementById('files').files];await call('start');state=await call('');for(const p of state.parts){if(state.completed?.some(x=>x?.sha256===p.sha256))continue;const f=files.find(f=>f.name===p.name);if(!f||f.size!==p.size)throw Error('الجزء المطلوب غير موجود أو حجمه مختلف: '+p.name);status.textContent='التحقق من الجزء '+p.number+' / '+state.parts.length;const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',await f.arrayBuffer()))].map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==p.sha256)throw Error('بصمة الملف مختلفة');status.textContent='رفع الجزء '+p.number+' / '+state.parts.length;await call('part&part='+p.number,f);}const done=await call('complete');if(!done.ready)throw Error('لم يكتمل التحقق');status.textContent='اكتمل رفع جميع المقاطع الـ'+done.files+' والتحقق منها.';}catch(e){status.textContent='توقف الرفع: '+e.message+' — يمكنك استئناف الأجزاء المتبقية.';}finally{send.disabled=false;}};
</script></html>
