<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>غرفة السيرفرات</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060e18}.room{position:absolute;inset:0;overflow:hidden;isolation:isolate;animation:drift 38s ease-in-out infinite alternate;transform-origin:45% 48%}.room img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center;filter:brightness(.52) contrast(1.08) saturate(.76)}.room svg{position:absolute;z-index:2;overflow:visible}.room:before,.room:after{content:"";position:absolute;inset:0;pointer-events:none}.room:before{z-index:1;background:linear-gradient(130deg,#12438972,#071c4333 54%,#163a6a55);mix-blend-mode:color}.room:after{z-index:3;background:linear-gradient(90deg,#030a1200 15%,#05101d22 42%,#060e19d9 77%,#060c16ed),linear-gradient(0deg,#070e19bb 1%,transparent 60%)}.led-light{fill:var(--lamp);opacity:0}.led-halo{filter:blur(2px)}[data-on="true"] .led-light{opacity:1;filter:drop-shadow(0 0 3px var(--lamp))}.paused .room{animation-play-state:paused}@keyframes drift{from{transform:scale(1.035) translate3d(-.45%,.15%,0)}to{transform:scale(1.065) translate3d(.45%,-.2%,0)}}@media(max-width:600px){.room img{object-position:26% center}.room:after{background:linear-gradient(0deg,#070e19dd,#07101e88 35%,#050e1810 75%),linear-gradient(90deg,transparent,#06102066)}}@media(prefers-reduced-motion:reduce){.room{animation:none;transform:scale(1.035)}}
</style></head><body class="paused"><div class="room"><img src="/assets/os1/server-room.webp" alt=""><svg viewBox="0 0 1672 941"></svg></div><script src="/os1-led-engine.js"></script><script>
function fit(){const room=document.querySelector('.room'),svg=room.querySelector('svg'),bw=room.clientWidth,bh=room.clientHeight,scale=Math.max(bw/1672,bh/941),w=1672*scale,h=941*scale;Object.assign(svg.style,{width:w+'px',height:h+'px',left:((bw-w)*(innerWidth<=600?.26:.5))+'px',top:((bh-h)/2)+'px'});}fit();addEventListener('resize',fit);addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||e.data?.type!=='os-active')return;document.body.classList.toggle('paused',!e.data.active||matchMedia('(prefers-reduced-motion:reduce)').matches);});
</script></body></html>
