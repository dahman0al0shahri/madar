<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>نسختان، وما الذي تغيّر؟</title><desc>مقارنة تكشف الاختلاف؛ دمج يجمع المراجعات.</desc><rect width="800" height="330" rx="15" fill="#14202b"/><g font-family="Tahoma,Arial,sans-serif"><text x="400" y="39" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">نسختان، وما الذي تغيّر؟</text><rect x="75" y="74" width="290" height="160" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="435" y="74" width="290" height="160" rx="8" fill="#21313d" stroke="#3c5262"/><text x="220" y="108" text-anchor="middle" direction="rtl" font-size="19" fill="#f1c87a">النسخة المعدّلة</text><text x="580" y="108" text-anchor="middle" direction="rtl" font-size="19" fill="#8adbc1">المستند الأصلي</text><text x="220" y="163" text-anchor="middle" direction="rtl" font-size="21" fill="#e5edf3">الاجتماع: الثلاثاء</text><text x="580" y="163" text-anchor="middle" direction="rtl" font-size="21" fill="#e5edf3">الاجتماع: الاثنين</text><path d="M125 196h185" fill="none" stroke="#f1c87a" stroke-width="5" stroke-linecap="round"/><path d="M485 196h185" fill="none" stroke="#8adbc1" stroke-width="5" stroke-linecap="round"/><text x="400" y="309" text-anchor="middle" direction="rtl" font-size="17" fill="#b2c2ce">مقارنة تكشف الاختلاف؛ دمج يجمع المراجعات.</text></g></svg>