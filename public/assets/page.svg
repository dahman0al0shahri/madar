<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>الورقة والهوامش شيئان مختلفان</title><desc>تطبيق على يحدد: المستند كله أم نطاقًا منه.</desc><rect width="800" height="330" rx="15" fill="#14202b"/><g font-family="Tahoma,Arial,sans-serif"><text x="400" y="39" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">الورقة والهوامش شيئان مختلفان</text><rect x="280" y="62" width="240" height="220" rx="8" fill="#182732" stroke="#8adbc1"/><rect x="311" y="95" width="178" height="154" rx="8" fill="#21313d" stroke="#f1c87a"/><text x="400" y="170" text-anchor="middle" direction="rtl" font-size="21" fill="#e5edf3">منطقة النص</text><text x="400" y="85" text-anchor="middle" direction="rtl" font-size="16" fill="#f1c87a">هامش أعلى</text><text x="400" y="270" text-anchor="middle" direction="rtl" font-size="16" fill="#f1c87a">هامش أسفل</text><text x="650" y="164" text-anchor="middle" direction="rtl" font-size="21" fill="#8adbc1">حجم الورق</text><text x="155" y="164" text-anchor="middle" direction="rtl" font-size="19" fill="#f1c87a">فراغ حول النص</text><text x="400" y="309" text-anchor="middle" direction="rtl" font-size="17" fill="#b2c2ce">تطبيق على يحدد: المستند كله أم نطاقًا منه.</text></g></svg>