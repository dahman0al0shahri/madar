<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>قرارك يحسم التعديل</title><desc>إخفاء العلامات أو إيقاف التعقب لا يحسم هذا القرار.</desc><rect width="800" height="330" rx="15" fill="#14202b"/><g font-family="Tahoma,Arial,sans-serif"><text x="400" y="39" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">قرارك يحسم التعديل</text><rect x="240" y="74" width="320" height="77" rx="8" fill="#21313d" stroke="#3c5262"/><text x="400" y="120" text-anchor="middle" direction="rtl" font-size="21" fill="#e5edf3">حذف متعقّب: موعد قديم</text><path d="M310 114h180" fill="none" stroke="#ffb4b0" stroke-width="5" stroke-linecap="round"/><rect x="440" y="185" width="260" height="72" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="100" y="185" width="260" height="72" rx="8" fill="#21313d" stroke="#3c5262"/><text x="570" y="215" text-anchor="middle" direction="rtl" font-size="19" fill="#8adbc1">قبول الحذف</text><text x="570" y="243" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">تُزال العبارة</text><text x="230" y="215" text-anchor="middle" direction="rtl" font-size="19" fill="#f1c87a">رفض الحذف</text><text x="230" y="243" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">تعود العبارة</text><text x="400" y="309" text-anchor="middle" direction="rtl" font-size="17" fill="#b2c2ce">إخفاء العلامات أو إيقاف التعقب لا يحسم هذا القرار.</text></g></svg>