<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>ثلاثة مفاهيم متقاربة</title><desc>الأنماط والنسق يتكاملان، لكنهما ليسا الشيء نفسه.</desc><rect width="800" height="330" rx="15" fill="#14202b"/><g font-family="Tahoma,Arial,sans-serif"><text x="400" y="39" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">ثلاثة مفاهيم متقاربة</text><rect x="539" y="84" width="225" height="180" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="288" y="84" width="225" height="180" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="36" y="84" width="225" height="180" rx="8" fill="#21313d" stroke="#3c5262"/><text x="651" y="125" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">نمط</text><text x="651" y="173" text-anchor="middle" direction="rtl" font-size="19" fill="#e5edf3">تنسيق مسمى</text><text x="651" y="216" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">مثل: عنوان ١</text><text x="400" y="125" text-anchor="middle" direction="rtl" font-size="23" fill="#f1c87a">مجموعة أنماط</text><text x="400" y="173" text-anchor="middle" direction="rtl" font-size="19" fill="#e5edf3">تعريفات متناسقة</text><text x="400" y="216" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">عناوين ومتن</text><text x="148" y="125" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">نسق</text><text x="148" y="173" text-anchor="middle" direction="rtl" font-size="19" fill="#e5edf3">ألوان وخطوط</text><text x="148" y="216" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">وتأثيرات</text><text x="400" y="309" text-anchor="middle" direction="rtl" font-size="17" fill="#b2c2ce">الأنماط والنسق يتكاملان، لكنهما ليسا الشيء نفسه.</text></g></svg>