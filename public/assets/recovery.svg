<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img"><title>معلومات استرداد دورية</title><desc>الاسترداد ليس ضمانًا لاستعادة كل التعديلات.</desc><rect width="800" height="330" rx="15" fill="#14202b"/><g font-family="Tahoma,Arial,sans-serif"><text x="400" y="39" text-anchor="middle" direction="rtl" font-size="23" fill="#8adbc1">معلومات استرداد دورية</text><path d="M130 163h540" fill="none" stroke="#617a8e" stroke-width="5" stroke-linecap="round"/><rect x="510" y="104" width="210" height="115" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="292" y="104" width="180" height="115" rx="8" fill="#21313d" stroke="#3c5262"/><rect x="70" y="104" width="180" height="115" rx="8" fill="#21313d" stroke="#3c5262"/><text x="615" y="146" text-anchor="middle" direction="rtl" font-size="18" fill="#8adbc1">آخر نسخة استرداد</text><text x="615" y="182" text-anchor="middle" direction="rtl" font-size="21" fill="#e5edf3">يمكن أن تتاح</text><text x="382" y="146" text-anchor="middle" direction="rtl" font-size="18" fill="#f1c87a">تعديلات أحدث</text><text x="382" y="182" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">قد لا تكون محفوظة</text><text x="160" y="146" text-anchor="middle" direction="rtl" font-size="18" fill="#ffb4b0">إغلاق مفاجئ</text><text x="160" y="182" text-anchor="middle" direction="rtl" font-size="17" fill="#e5edf3">ابحث عن نسخة</text><text x="400" y="309" text-anchor="middle" direction="rtl" font-size="17" fill="#b2c2ce">الاسترداد ليس ضمانًا لاستعادة كل التعديلات.</text></g></svg>