name: Repository checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check structure, generation, documentation and existing tests
        run: node scripts/check-repository.mjs
  application-checks:
    name: Application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Lint application routes, services, hub, build tools and tests
        run: npm run check:lint
      - name: Check TypeScript and unused locals
        run: npm run check:types
      - name: Build and test isolated startup, persistence and backup recovery
        run: npm run check:application
  browser-checks:
    outputs:
      atlas-sha256: ${{ steps.atlas.outputs.sha256 }}
    name: Browser and visual (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Install pinned Chromium and system libraries
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - name: Test browser interactions and compare reviewed screenshots
        run: npm run check:browser
      - name: Keep synthetic browser evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .sites-runtime/browser-check-*/artifacts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Build and verify interactive atlas
        run: |
          npm run atlas:build
          npm run atlas:check
      - name: Keep offline source atlas
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: madar-code-atlas
          path: out/code-atlas.html
          if-no-files-found: error
          retention-days: 7
      - name: Package the verified HTML for Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: atlas
        run: |
          mkdir "$RUNNER_TEMP/atlas-site"
          cp out/code-atlas.html "$RUNNER_TEMP/atlas-site/index.html"
          echo "sha256=$(sha256sum out/code-atlas.html | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Upload the documentation site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/atlas-site
  publish-atlas:
    name: Publish verified code atlas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [local-checks, application-checks, browser-checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish the verified main snapshot
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the HTML served at the public address
        env:
          ATLAS_URL: ${{ steps.publish.outputs.page_url }}
          EXPECTED_SHA256: ${{ needs.browser-checks.outputs.atlas-sha256 }}
        run: |
          for attempt in {1..18}; do
            if curl --fail --silent --show-error --max-time 30 "${ATLAS_URL%/}/?revision=$GITHUB_SHA" -o "$RUNNER_TEMP/served.html" &&
               echo "$EXPECTED_SHA256  $RUNNER_TEMP/served.html" | sha256sum --check --status; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The public HTML does not match the checked atlas."
          exit 1
