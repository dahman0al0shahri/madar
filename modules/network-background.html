  <div class="net-stage">
    <canvas role="img" aria-label="خلفية فضاء إنترنت فحمية بوصلات نحاسية؛ أجهزة صغيرة ورسائل وصور وصوت وملفات موزعة في عمق الشبكة وتتحرك بين وصلاتها، بدون مشهد مركزي أو عناوين"></canvas>
    <button class="net-pause cursor-interaction" type="button" aria-label="إيقاف حركة الخلفية" aria-pressed="false">Ⅱ</button>
    <button class="device-hit cursor-interaction" type="button" data-device="0" aria-label="حاسب متصل"></button>
    <button class="device-hit cursor-interaction" type="button" data-device="1" aria-label="خادم موقع"></button>
    <button class="device-hit cursor-interaction" type="button" data-device="2" aria-label="هاتف متصل"></button>
    <div class="net-tip" hidden></div>
    <div class="demo-scroll" aria-label="صفحة تجريبية قابلة للتمرير">
      <div class="demo-page">
        <nav class="demo-nav" aria-label="أقسام المعاينة"><span class="demo-logo">مدار</span><button type="button" class="cursor-interaction" data-view="home" aria-pressed="true">الرئيسية</button><button type="button" class="cursor-interaction" data-view="lessons" aria-pressed="false">الدروس</button></nav>
        <section class="demo-hero"><span class="demo-eyebrow">التوجيه والتحويل</span><h2>من فهم الشبكة…<br>إلى ضبطها بيدك.</h2><p>تعرف وش خطوتك الجاية، وتفهم ليه تسويها، وتشوف دليل تقدّمك.</p><button class="demo-start cursor-interaction" type="button">يلا نبدأ نذاكر</button></section>
        <section class="demo-lessons"><h3>خطوتك الجاية</h3><div class="lesson-line"><small>01</small><span>الشبكات المحلية الافتراضية</span></div><div class="lesson-line"><small>02</small><span>الوصلات بين المحوّلات</span></div><div class="lesson-line"><small>03</small><span>التوجيه بين الشبكات</span></div></section>
      </div>
    </div>
    <div class="self-device" aria-hidden="true"><div class="self-screen"><canvas class="mirror-canvas"></canvas><div class="mirror-surface"></div><span class="mirror-pointer"><i data-lucide="mouse-pointer-2"></i></span></div></div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('madar-net-space');
    const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),stage=root.querySelector('.net-stage');
    const pause=root.querySelector('.net-pause');
    const hits=[...root.querySelectorAll('.device-hit')],tip=root.querySelector('.net-tip'),buttons=[...root.querySelectorAll('[data-scene]')];
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    let saved=window.openai?.widgetState?.privateContent||{};
    try{if(!Object.keys(saved).length)saved=JSON.parse(localStorage.getItem('madar-network-background-v2')||'{}')}catch{}
    const scroller=root.querySelector('.demo-scroll'),page=root.querySelector('.demo-page');
    const mirrorSurface=root.querySelector('.mirror-surface'),mirrorCanvas=root.querySelector('.mirror-canvas'),mirrorCtx=mirrorCanvas.getContext('2d'),screen=root.querySelector('.self-screen'),device=root.querySelector('.self-device'),pointer=root.querySelector('.mirror-pointer');
    let mirrorPage=null,view='home',cursorX=0,cursorY=0,touchUntil=0,signals=0,mirrorScale=1,mirrorX=0,mirrorY=0;
    function refreshMirror(){
      mirrorPage=page.cloneNode(true);mirrorPage.classList.add('mirror-page');mirrorPage.setAttribute('inert','');mirrorPage.querySelectorAll('button').forEach(b=>b.removeAttribute('data-view'));mirrorSurface.replaceChildren(mirrorPage);layoutMirror();
    }
    function layoutMirror(){
      if(!W||!mirrorPage)return;
      mirrorScale=Math.min(screen.clientWidth/W,screen.clientHeight/H);mirrorX=(screen.clientWidth-W*mirrorScale)/2;mirrorY=(screen.clientHeight-H*mirrorScale)/2;
      mirrorSurface.style.width=W+'px';mirrorSurface.style.height=H+'px';mirrorSurface.style.left=mirrorX+'px';mirrorSurface.style.top=mirrorY+'px';mirrorSurface.style.transform='scale('+mirrorScale+')';mirrorPage.style.width=W+'px';mirrorPage.style.transform='translateY('+(-scroller.scrollTop)+'px)';
      mirrorCanvas.width=Math.round(screen.clientWidth*Math.min(devicePixelRatio||1,2));mirrorCanvas.height=Math.round(screen.clientHeight*Math.min(devicePixelRatio||1,2));
    }
    function openView(next,persist=true){
      view=next;page.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));
      page.querySelector('h2').innerHTML=view==='home'?'من فهم الشبكة…<br>إلى ضبطها بيدك.':'كل خطوة…<br>لها معنى.';
      page.querySelector('.demo-hero p').textContent=view==='home'?'تعرف وش خطوتك الجاية، وتفهم ليه تسويها، وتشوف دليل تقدّمك.':'ابدأ بالفهم، ثم طبّق على الشبكة بنفسك.';
      page.querySelector('.demo-start').textContent=view==='home'?'يلا نبدأ نذاكر':'شوف الدروس';
      if(persist)signals|=4;scroller.scrollTop=0;refreshMirror();root.dataset.discovery=String(signals);if(persist)save();
    }
    let stateStamp=Number(saved.stamp)||0;
    let hostActive=parent===window,frameHandle=0;
    let paused=typeof saved.paused==='boolean'?saved.paused:reduced;
    let scene=Number.isInteger(saved.scene)?Math.max(0,Math.min(4,saved.scene)):0;
    let W=0,H=0,mobile=false,clock=3.8,last=0,hover=-1,mx=0,my=0,tx=0,ty=0,visible=hostActive&&!document.hidden;
    let nodes=[],edges=[],landmarks=[],traffic=[],points=[],lastPhase='';
    const duration=18;
    const names=['نافذة على العالم','وجهًا لوجه… عبر المسافات','عالم واحد. لاعبان.','ملفاتك، أينما كنت','رسالة تعبر المسافات'];
    const phases=[['طلب موقع يسافر عبر الشبكة','الخادم يستقبل الطلب','تعود الصور والنصوص إلى جهازك','صفحة اكتملت… واتصال يستمر'],['بدء الاتصال بين الطرفين','الصوت والصورة في الاتجاهين','حديث متبادل، لحظة بلحظة','المسافة تختفي خلف الاتصال'],['لاعبان يتصلان بخادم اللعبة','حركة اللاعب تصل إلى الخادم','تحديث اللعب يصل للطرف الآخر','اللعب مستمر بين الجهازين'],['صورة على جهازك، جاهزة للرفع','الملف في طريقه إلى السحابة','اكتمل الرفع إلى السحابة','صورتك أصبحت على جهازك الثاني'],['رسالة تُكتب على الجهاز','إرسال البريد عبر الشبكة','وصلت رسالة جديدة','تُفتح الرسالة عند الطرف الآخر']];
    const deviceNames=[['حاسب متصل','خادم موقع','هاتف متصل'],['طرف المكالمة الأول','Router الشبكة','طرف المكالمة الثاني'],['جهاز اللاعب الأول','خادم اللعبة','جهاز اللاعب الثاني'],['حاسب يرفع الملف','التخزين السحابي','هاتف يستقبل الملف'],['مرسل البريد','خادم البريد','مستقبل البريد']];
    const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
    const mix=(a,b,t)=>a+(b-a)*t;
    const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
    const color=(a=1)=>`rgba(220,155,93,${a})`;
    let seed=19;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
    function line(x1,y1,x2,y2,c,w=1){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
    function rect(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
    function pathPoly(arr,fill,stroke){ctx.beginPath();arr.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=.8;ctx.stroke()}}
    function glow(x,y,r,a=.1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(210,125,56,${a})`);g.addColorStop(.3,`rgba(137,79,38,${a*.45})`);g.addColorStop(1,'rgba(110,60,25,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}
    function label(text,x,y,sz=10,c='#a99178',align='center'){ctx.font=`${sz}px Tahoma,Arial`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=c;ctx.fillText(text,x,y)}
    function build(){
      const b=stage.getBoundingClientRect();W=b.width;H=b.height;mobile=W<550;const dpr=Math.min(devicePixelRatio||1,2.5);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=34;
      nodes=[];edges=[];landmarks=[];traffic=[];
      for(let z=0;z<3;z++){
        const count=mobile?58:90;
        for(let i=0;i<count;i++){
          const x=rand()*W*1.3-W*.15,y=rand()*(H+100)-50;
          nodes.push({x,y,z,r:.8+z*.4});
        }
      }
      nodes.forEach((n,i)=>{
        const near=nodes.map((q,j)=>({j,d:Math.hypot(n.x-q.x,n.y-q.y)})).filter(q=>q.j>i&&nodes[q.j].z===n.z&&q.d<(mobile?160:230)).sort((a,b)=>a.d-b.d).slice(0,n.z===0?2:3);
        near.forEach(q=>edges.push({a:i,b:q.j,z:n.z}));
        if(i%11===0)landmarks.push({x:n.x,y:n.y,z:n.z,type:i%3});
      });
      for(let i=0;i<(mobile?22:48);i++)traffic.push({edge:Math.floor(rand()*edges.length),position:rand(),forward:true,speed:9+rand()*9,type:i%5,size:.5+rand()*.3});
      points=mobile?[{x:W*.23,y:H*.35},{x:W*.69,y:H*.46},{x:W*.3,y:H*.70}]:[{x:W*.18,y:H*.52},{x:W*.54,y:H*.36},{x:W*.83,y:H*.64}];
      hits.forEach((b,i)=>{b.style.left=points[i].x+'px';b.style.top=points[i].y+'px';b.style.width=(i===1?95:110)+'px';b.style.height=(i===1?110:100)+'px'});layoutMirror();
    }
    function project(n){return{x:n.x+mx*(n.z+1)*.35,y:n.y+my*(n.z+1)*.35}}
    function envelope(x,y,s=1,open=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(-12,-8,24,17,2,'#2d2320','#efb47f',1.25);line(-11,-7,0,1,'#f6c699',1);line(0,1,11,-7,'#f6c699',1);line(-11,8,-3,0,'#946849',.7);line(11,8,3,0,'#946849',.7);if(open)pathPoly([[-12,-8],[0,-18],[12,-8]],'#bf895c','#f4c597');ctx.restore()}
    function picture(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);rect(-12,-10,24,20,2,'#303132','#ecb781',1);ctx.fillStyle='#e9c08f';ctx.beginPath();ctx.arc(5,-4,2,0,7);ctx.fill();pathPoly([[-10,8],[-3,-2],[3,4],[7,0],[10,8]],'#9d7854');ctx.restore()}

    function advanceTraffic(dt){
      for(const f of traffic){
        let distance=f.speed*dt;
        while(distance>0){
          const e=edges[f.edge],a=nodes[e.a],b=nodes[e.b];
          const length=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
          const remaining=(1-f.position)*length;
          if(distance<remaining){f.position+=distance/length;break;}
          distance-=remaining;
          const reached=f.forward?e.b:e.a;
          const options=[];edges.forEach((edge,index)=>{if(index!==f.edge&&(edge.a===reached||edge.b===reached))options.push(index)});
          f.edge=options.length?options[Math.floor(rand()*options.length)]:f.edge;
          f.forward=edges[f.edge].a===reached;
          f.position=0;
        }
      }
    }

    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(!s||Number(s.stamp||0)<stateStamp)return;stateStamp=Number(s.stamp)||stateStamp;if(typeof s.paused==='boolean')paused=s.paused;if(Number.isInteger(s.scene))scene=Math.max(0,Math.min(4,s.scene));sync();render();syncVisibility()});
    refreshMirror();if(saved.view==='lessons')openView('lessons',false);new ResizeObserver(()=>{build();render()}).observe(stage);build();sync();render();scheduleFrame();
  })();
